<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feuille d'avant-match U14</title>
    <link rel="stylesheet" href="feuille_avant_match.css" />
  </head>
  <body>
    <div class="page">
      <div class="toolbar">
        <div>
          <h1>Feuille d'avant-match</h1>
          <small
            >Charge ton fichier config.json pour afficher automatiquement la
            composition.</small
          >
        </div>
        <div class="actions">
          <label class="btn" for="configFile"
            >📂 Charger la configuration</label
          >
          <button class="btn secondary" onclick="window.print()">
            🖨️ Imprimer
          </button>
          <input id="configFile" type="file" accept=".json,application/json" />
        </div>
      </div>

      <section class="match-card">
        <div class="match-title">
          <div class="team" id="team1">-</div>
          <div class="vs">VS</div>
          <div class="team" id="team2">—</div>
        </div>
        <div class="meta">
          <div class="meta-box">
            <span>TYPE DE MATCH</span><strong id="matchType">—</strong>
          </div>
          <div class="meta-box">
            <span>DATE</span><strong id="matchDate">—</strong>
          </div>
          <div class="meta-box">
            <span>SYSTÈME</span><strong id="formation">—</strong>
          </div>
        </div>
      </section>

      <div class="layout">
        <section class="panel">
          <h2>Joueurs</h2>          
          <div id="players"></div>
        </section>

        <section class="panel pitch-wrap">
          <div class="pitch" id="pitch">
            <div class="line center-circle"></div>
            <div class="line box-left"></div>
            <div class="line box-right"></div>
            <div class="line goal-left"></div>
            <div class="line goal-right"></div>
          </div>
          <div class="substitutes">
            <h2>Remplaçants</h2>
            <div class="substitute-list" id="substitutes"></div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const defaultConfig = {
        equipe: "EJPS 2 U14",
        adversaire: "Alsasud",
        lieu: "Stade Municipal",
        domicile: false,
        typeMatch: "Championnat J1",
        date: "2026-09-12",
        formation: "4-3-3",
        joueurs: [
          { numero: 1, nom: "Benjamin M.", poste: "GB" },
          { numero: 2, nom: "Daniel T.", poste: "DG" },
          { numero: 3, nom: "Alexandre B.", poste: "DD" },
          { numero: 4, nom: "Simeon H.", poste: "DCD" },
          { numero: 6, nom: "Louën F.", poste: "MDC" },
          { numero: 7, nom: "Matthew M.", poste: "AD" },
          { numero: 8, nom: "Hugo K.", poste: "MCG" },
          { numero: 9, nom: "Cays L.", poste: "R3" },
          { numero: 10, nom: "Yamin G.", poste: "AG" },
          { numero: 11, nom: "Matteo S.", poste: "AC" },
          { numero: 12, nom: "Djelle G.", poste: "R2" },
          { numero: 18, nom: "Samuel H.", poste: "DCG" },
          { numero: 19, nom: "Mathéo V.", poste: "MCD", capitaine: true },
          { numero: 20, nom: "Leo O.", poste: "R1" },
        ],
      };

      const positionMap = {
        GB: [7, 50],
        GK: [7, 50],

        DG: [30, 12],
        DCG: [25, 36],
        DC: [25, 50],
        DCD: [25, 64],
        DD: [30, 87],

        MDC: [45, 50],
        MCG: [55, 30],
        MC: [48, 50],
        MCD: [55, 70],
        MOC: [62, 50],

        AG: [70, 12],
        BU: [82, 50],
        AC: [82, 50],
        AD: [70, 87],
        ATT: [82, 50],
      };

      function formatDate(value) {
        if (!value) return "—";
        const d = new Date(value + (value.length === 10 ? "T12:00:00" : ""));
        if (isNaN(d)) return value;
        return d.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric",
        });
      }

      function loadConfig(config) {
        document.getElementById("team1").textContent =
          (config.domicile ? config.equipe : config.adversaire) || "—";
        document.getElementById("team2").textContent =
          (config.domicile ? config.adversaire : config.equipe) || "—";
        document.getElementById("matchType").textContent =
          config.typeMatch || "—";
        document.getElementById("matchDate").textContent = formatDate(
          config.date,
        );
        document.getElementById("formation").textContent =
          config.formation || "—";

        const players = document.getElementById("players");
        players.innerHTML = "";

        (config.joueurs || []).forEach((p) => {
          const row = document.createElement("div");
          row.className = "player";
          row.innerHTML = `
      <div class="number">${escapeHtml(p.numero)}</div>
      <div>
        <div class="player-name">
          ${escapeHtml(p.nom)}
          ${p.capitaine ? '<span class="captain-badge">C</span>' : ""}
        </div>
      </div>`;
          players.appendChild(row);
        });

        const substitutes = document.getElementById("substitutes");
        substitutes.innerHTML = "";
        (config.joueurs || [])
          .filter((p) => /^R\d+$/i.test((p.poste || "").trim()))

          .sort(
            (a, b) =>
              Number(a.poste.slice(1)) - Number(b.poste.slice(1)),
          )
          .forEach((p) => {
            const item = document.createElement("div");
            item.className = "substitute";
            item.innerHTML = `
      <div class="number">${escapeHtml(p.numero)}</div>
      <div>
        <div class="substitute-name">${escapeHtml(p.nom)}</div>
        <div class="substitute-poste">${escapeHtml(p.poste)}</div>
      </div>`;
            substitutes.appendChild(item);
          });

        // Supprime uniquement les anciens joueurs du terrain
        document.querySelectorAll("#pitch .spot").forEach((e) => e.remove());

        const occupied = {};
        (config.joueurs || [])
          .filter((p) => !/^R\d+$/i.test((p.poste || "").trim()))
          .forEach((p) => {
            const key = (p.poste || "").toUpperCase();
            let pos = positionMap[key];

            // Si plusieurs joueurs ont le même poste, on les décale automatiquement
            if (!pos) return;
            const count = occupied[key] || 0;
            occupied[key] = count + 1;

            let x = pos[0],
              y = pos[1];
            if (count > 0) {
              const offset = count % 2 === 1 ? 9 : -9;
              y = Math.max(8, Math.min(92, y + offset));
            }

            const spot = document.createElement("div");
            spot.className = "spot";
            spot.style.left = x + "%";
            spot.style.top = y + "%";
            spot.innerHTML = `
      <div class="ball">${escapeHtml(p.numero)}</div>
      <div class="label">${escapeHtml(p.nom)}</div>`;
            document.getElementById("pitch").appendChild(spot);
          });
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      }

      document
        .getElementById("configFile")
        .addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              loadConfig(JSON.parse(e.target.result));
            } catch (err) {
              alert("Le fichier JSON est invalide.");
            }
          };
          reader.readAsText(file, "UTF-8");
        });

      loadConfig(defaultConfig);
    </script>
  </body>
</html>
